<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Near Talk</title>
<style>
:root{--bg:#0b1220;--card:#131c2e;--line:#22304a;--tx:#e8eefc;--mut:#8b9ab8;--blue:#3b82f6;--grn:#22a06b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Plus Jakarta Sans","Noto Sans Bengali",system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
h1{font-size:22px;margin:0;font-weight:600}
.pill{font-size:12px;padding:5px 10px;border-radius:99px;background:var(--card);color:var(--mut);border:1px solid var(--line)}
.pill.on{color:#7ee2b0;border-color:var(--grn)}
main{flex:1;overflow:auto;padding:0 16px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.card p{color:var(--mut);font-size:14px;line-height:1.5;margin:6px 0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;border:0;border-radius:14px;padding:13px 16px;background:var(--blue);color:#fff;font-weight:600;flex:1;min-width:120px}
button.g{background:var(--grn)}button.o{background:transparent;border:1px solid var(--line);color:var(--tx)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid #93c5fd;outline-offset:2px}
textarea,input{width:100%;background:#0b1220;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:11px;font:inherit}
textarea{height:84px;font-size:11px;word-break:break-all;margin-top:10px}
#qr{background:#fff;padding:10px;border-radius:14px;width:max-content;margin:12px auto 0}
video{width:100%;border-radius:14px;margin-top:10px}
.hide{display:none!important}
#chat{flex:1;display:flex;flex-direction:column;min-height:0}
#msgs{flex:1;overflow:auto;padding:8px 16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:10px 13px;border-radius:16px;background:var(--card);border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--blue);border-color:var(--blue)}
.m img{max-width:100%;border-radius:10px;display:block}
.m audio{max-width:100%}
#bar{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
#bar button{flex:0 0 auto;min-width:46px;padding:11px}
#bar input{flex:1}
#bar button.rec{background:#dc2626}
small{color:var(--mut)}
</style>
</head>
<body>
<header><h1>Near Talk</h1><span id="st" class="pill">Not connected</span></header>

<main id="setup">
  <div class="card">
    <b>Internet ছাড়া চ্যাট</b>
    <p>দুই ফোন একই Wi-Fi বা একটির Hotspot-এ থাকলেই হবে। একজন Host, অন্যজন Join করবে। পেজটি সরাসরি Chrome-এ খুলুন এবং Mic/Camera Allow দিন।</p>
    <div class="row"><button id="bh">Host</button><button id="bj" class="o">Join</button></div>
  </div>
  <div id="pair" class="card hide">
    <b id="ptitle"></b>
    <p id="pdesc"></p>
    <div id="qr" class="hide"></div>
    <textarea id="code" aria-label="Pairing code" placeholder="Code"></textarea>
    <div class="row" style="margin-top:10px"><button id="cp" class="o">Copy</button><button id="pa" class="o">Paste</button><button id="sc" class="o">Scan QR</button><button id="ap" class="g">Apply</button></div>
    <video id="vid" class="hide" playsinline muted></video>
  </div>
</main>

<section id="chat" class="hide">
  <div id="msgs"></div>
  <div id="bar">
    <button id="ph" class="o" aria-label="Send photo">📷</button>
    <button id="mc" class="o" aria-label="Record voice">🎤</button>
    <input id="tx" placeholder="Message" autocomplete="off">
    <button id="sd">Send</button>
  </div>
  <input type="file" id="fi" accept="image/*" class="hide">
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
const $=id=>document.getElementById(id);
let pc,dc,mode,buf={};
const enc=d=>{const L=d.sdp.split(/\r?\n/),g=k=>(L.find(l=>l.startsWith(k))||'').slice(k.length);
  const all=L.filter(l=>l.startsWith('a=candidate:')&&l.split(' ')[2].toLowerCase()==='udp');
  let c=all.filter(l=>!l.split(' ')[4].includes(':'));if(!c.length)c=all;
  return btoa(JSON.stringify({t:d.type[0],u:g('a=ice-ufrag:'),p:g('a=ice-pwd:'),f:g('a=fingerprint:sha-256 '),s:g('a=setup:'),c:c.map(l=>l.slice(12))}))};
const dec=s=>{const o=JSON.parse(atob(s.trim()));return{type:o.t==='o'?'offer':'answer',sdp:['v=0','o=- 1 2 IN IP4 127.0.0.1','s=-','t=0 0','a=group:BUNDLE 0','a=msid-semantic: WMS','m=application 9 UDP/DTLS/SCTP webrtc-datachannel','c=IN IP4 0.0.0.0','a=ice-ufrag:'+o.u,'a=ice-pwd:'+o.p,'a=fingerprint:sha-256 '+o.f,'a=setup:'+o.s,'a=mid:0','a=sctp-port:5000','a=max-message-size:262144',...o.c.map(x=>'a=candidate:'+x),'a=end-of-candidates',''].join('\r\n')}};
const setSt=(t,on)=>{$('st').textContent=t;$('st').className='pill'+(on?' on':'')};

let micOk=false;async function mic(){try{const s=await Promise.race([navigator.mediaDevices.getUserMedia({audio:true}),new Promise((_,j)=>setTimeout(j,15000))]);s.getTracks().forEach(t=>t.stop());micOk=true}catch(e){}}
function mk(){
  pc=new RTCPeerConnection({iceServers:[]});
  pc.onconnectionstatechange=()=>{const s=pc.connectionState;if(s==='failed')setSt('Failed');else if(['disconnected','closed'].includes(s))setSt('Disconnected');if(s==='failed')alert('Connect হয়নি। দুই ফোন একই Wi-Fi/Hotspot-এ আছে কিনা দেখুন এবং Mic permission Allow দিয়ে আবার Host/Join করুন।')};
  pc.ondatachannel=e=>setup(e.channel);
}
function setup(c){
  dc=c;
  c.onopen=()=>{$('setup').classList.add('hide');$('chat').classList.remove('hide');setSt('Connected',1);sys('Connected. Say hi!')};
  c.onclose=()=>{setSt('Disconnected');sys('Connection closed')};
  c.onmessage=onmsg;
}
const gather=()=>new Promise(r=>{
  if(pc.iceGatheringState==='complete')return r();
  pc.onicegatheringstatechange=()=>pc.iceGatheringState==='complete'&&r();
  setTimeout(r,4000);
});
function showCode(){
  if(/\.local/.test(pc.localDescription.sdp))alert('Mic permission Allow দিন, নাহলে অন্য ফোন connect হবে না। পেজটি সরাসরি Chrome-এ খুলুন।');
  const c=enc(pc.localDescription);
  $('code').value=c;
  const q=$('qr');q.innerHTML='';q.classList.remove('hide');
  try{new QRCode(q,{text:c,width:280,height:280,correctLevel:QRCode.CorrectLevel.L})}catch(e){q.classList.add('hide')}
}
function step(t,d){$('pair').classList.remove('hide');$('ptitle').textContent=t;$('pdesc').textContent=d}

$('bh').onclick=async()=>{
  mode='host';await mic();mk();setup(pc.createDataChannel('c'));
  setSt('Preparing…');
  await pc.setLocalDescription(await pc.createOffer());await gather();
  step('Step 1: Show this to the other phone','অন্য ফোনে Join চেপে এই QR স্ক্যান করুন বা code পাঠান। তারপর তার answer code এখানে Scan/Paste করে Apply চাপুন।');
  showCode();setSt('Waiting for answer');
};
$('bj').onclick=async()=>{
  mode='join';mk();$('qr').classList.add('hide');$('code').value='';
  step('Step 1: Get the Host code','Host ফোনের QR স্ক্যান করুন বা code paste করে Apply চাপুন।');
  await mic();
};
$('ap').onclick=async()=>{
  const v=$('code').value.trim();if(!v)return;
  try{
    stopScan();
    if(mode==='host'){await pc.setRemoteDescription(dec(v));setSt('Connecting…')}
    else{
      setSt('Creating answer…');
      await pc.setRemoteDescription(dec(v));
      await pc.setLocalDescription(await pc.createAnswer());await gather();
      step('Step 2: Show this to the Host','Host ফোনে এই QR স্ক্যান করান বা code পাঠান, তারপর Host-এ Apply চাপুন।');
      showCode();setSt('Waiting for Host');
    }
  }catch(e){setSt('Error');alert('Error: '+(e.message||e)+'\nCode পুরোটা ঠিকমতো copy/scan হয়েছে কিনা দেখুন, দরকারে Join আবার চাপুন।')}
};
$('cp').onclick=()=>{$('code').select();navigator.clipboard&&navigator.clipboard.writeText($('code').value).catch(()=>{})};
$('pa').onclick=async()=>{try{$('code').value=await navigator.clipboard.readText()}catch(e){$('code').focus()}};

let stream,raf;
$('sc').onclick=async()=>{
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v=$('vid');v.srcObject=stream;v.classList.remove('hide');await v.play();
    const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
    const tick=()=>{
      if(v.videoWidth){cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);
        const r=jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height);
        if(r){$('code').value=r.data;stopScan();$('ap').click();return}}
      raf=requestAnimationFrame(tick)};
    tick();
  }catch(e){alert('Camera চালু হয়নি ('+e.name+')। পেজটি Chrome-এ সরাসরি খুলে Camera Allow দিন, অথবা Copy/Paste করুন।')}
};
function stopScan(){cancelAnimationFrame(raf);stream&&stream.getTracks().forEach(t=>t.stop());stream=null;$('vid').classList.add('hide')}

/* chat */
function bubble(kind,data,me){
  const d=document.createElement('div');d.className='m'+(me?' me':'');
  if(kind==='txt')d.textContent=data;
  else if(kind==='img'){const i=new Image();i.src=data;d.appendChild(i)}
  else if(kind==='aud'){const a=document.createElement('audio');a.controls=true;a.src=data;d.appendChild(a)}
  $('msgs').appendChild(d);$('msgs').scrollTop=1e9;
}
const sys=t=>{const s=document.createElement('small');s.style.alignSelf='center';s.textContent=t;$('msgs').appendChild(s)};
function send(kind,data){
  if(!dc||dc.readyState!=='open')return alert('Not connected');
  if(kind==='txt'){dc.send(JSON.stringify({k:kind,d:data}))}
  else{
    const id=Math.random().toString(36).slice(2),N=12000,n=Math.ceil(data.length/N);
    for(let i=0;i<n;i++)dc.send(JSON.stringify({k:kind,id,i,n,d:data.slice(i*N,(i+1)*N)}));
  }
  bubble(kind,data,true);
}
function onmsg(e){
  const m=JSON.parse(e.data);
  if(m.k==='txt')return bubble('txt',m.d,false);
  const b=buf[m.id]=buf[m.id]||[];b[m.i]=m.d;
  if(b.filter(Boolean).length===m.n){bubble(m.k,b.join(''),false);delete buf[m.id]}
}
$('sd').onclick=()=>{const v=$('tx').value.trim();if(v){send('txt',v);$('tx').value=''}};
$('tx').onkeydown=e=>{if(e.key==='Enter')$('sd').click()};
$('ph').onclick=()=>$('fi').click();
$('fi').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const im=new Image();im.onload=()=>{
    const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    send('img',c.toDataURL('image/jpeg',.7))};
  im.src=URL.createObjectURL(f);e.target.value='';
};
let rec,chunks;
$('mc').onclick=async()=>{
  if(rec&&rec.state==='recording'){rec.stop();return}
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:true});
    rec=new MediaRecorder(s);chunks=[];
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{s.getTracks().forEach(t=>t.stop());$('mc').classList.remove('rec');
      const fr=new FileReader();fr.onload=()=>send('aud',fr.result);fr.readAsDataURL(new Blob(chunks,{type:rec.mimeType}))};
    rec.start();$('mc').classList.add('rec');
  }catch(e){alert('Microphone permission needed')}
};
</script>
</body>
</html>
